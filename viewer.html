<title>לוח גורדון</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Frank+Ruhl+Libre:wght@700&display=swap">
<style>
:root{
  --bg:#FAF9F6; --surface:#FFFFFF; --ink:#22303D; --muted:#6B7A88; --line:#E3E0D8;
  --accent:#0E6E66; --accent-ink:#FFFFFF;
  --home:#E3EEF7; --home-b:#B9D4E8; --tln:#E4F0DF; --tln-b:#BFDCB4;
  --mag:#E7E6F4; --mag-b:#C4C2E4; --pe:#FBEFD8; --pe-b:#EAD3A2;
  --fill:#D7EEF2; --fill-b:#68B7C4; --hole:#FBE4E1; --hole-b:#E5A79F;
  --away:#FDEBDC; --chip:#EFECE4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141B22; --surface:#1C2530; --ink:#E8EDF2; --muted:#93A1AE; --line:#2C3742;
    --accent:#3FB8AC; --accent-ink:#0E1A18;
    --home:#22384A; --home-b:#3A5B76; --tln:#253822; --tln-b:#3F5F37;
    --mag:#2B2A44; --mag-b:#4A4880; --pe:#3A3220; --pe-b:#6B5A2E;
    --fill:#173B42; --fill-b:#3FB8AC; --hole:#43231F; --hole-b:#8A4A40;
    --away:#3D2E1F; --chip:#242E39;
  }
}
:root[data-theme="dark"]{
  --bg:#141B22; --surface:#1C2530; --ink:#E8EDF2; --muted:#93A1AE; --line:#2C3742;
  --accent:#3FB8AC; --accent-ink:#0E1A18;
  --home:#22384A; --home-b:#3A5B76; --tln:#253822; --tln-b:#3F5F37;
  --mag:#2B2A44; --mag-b:#4A4880; --pe:#3A3220; --pe-b:#6B5A2E;
  --fill:#173B42; --fill-b:#3FB8AC; --hole:#43231F; --hole-b:#8A4A40;
  --away:#3D2E1F; --chip:#242E39;
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}   /* גובר על display:flex בסגנון המוטבע - אחרת התפריטים נשארים פתוחים */
body{background:var(--bg);color:var(--ink);font:16px/1.5 Heebo,"Segoe UI",Arial,sans-serif;direction:rtl}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:.9rem 1.2rem .7rem}
h1{font:700 1.5rem "Frank Ruhl Libre",Heebo,serif;letter-spacing:.01em}
h1 small{font:500 .8rem Heebo;color:var(--muted);margin-inline-start:.6rem}
nav{display:flex;gap:.4rem;margin-top:.7rem;flex-wrap:wrap}
nav button{border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:.35rem .9rem;border-radius:999px;font:500 .9rem Heebo;cursor:pointer}
nav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#chips{display:flex;gap:.35rem;margin-top:.55rem;flex-wrap:wrap}
#chips button{border:1px solid var(--line);background:var(--chip);color:var(--ink);
  padding:.22rem .7rem;border-radius:.5rem;font:500 .85rem Heebo;cursor:pointer}
#chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#chips select{border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:.3rem .6rem;border-radius:.5rem;font:500 .9rem Heebo}
main{padding:1rem 1.2rem 3rem;max-width:1080px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:.75rem;padding:1rem 1.1rem;margin-top:1rem}
.card h2{font:700 1.15rem "Frank Ruhl Libre",Heebo,serif}
.card .sub{color:var(--muted);font-size:.85rem;margin-top:.15rem}
.tblwrap{overflow-x:auto;margin-top:.7rem}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{border:1px solid var(--line);padding:.42rem .5rem;text-align:center;font-size:.86rem}
th{background:var(--chip);font-weight:700}
td .s{display:block;color:var(--muted);font-size:.74rem;margin-top:.1rem}
td .co{display:block;color:var(--accent);font-size:.74rem;font-weight:700}
td .aw{display:block;color:var(--muted);font-size:.7rem;font-style:italic}
tr th:first-child{width:2.6rem;font-variant-numeric:tabular-nums}
.k-home{background:var(--home);box-shadow:inset 3px 0 0 var(--home-b)}
.k-tln{background:var(--tln);box-shadow:inset 3px 0 0 var(--tln-b)}
.k-mag{background:var(--mag);box-shadow:inset 3px 0 0 var(--mag-b)}
.k-pe{background:var(--pe);box-shadow:inset 3px 0 0 var(--pe-b)}
.k-fill{background:var(--fill);box-shadow:inset 3px 0 0 var(--fill-b);font-weight:700}
.k-hole{background:var(--hole);box-shadow:inset 3px 0 0 var(--hole-b);color:var(--muted)}
.k-off{background:transparent;color:var(--muted)}
.k-half{background:linear-gradient(90deg,var(--tln) 0 50%,var(--home) 50% 100%);
  box-shadow:inset 3px 0 0 var(--tln-b)}
.duty{outline:2px dashed var(--pe-b);outline-offset:-3px}
td.num{font-variant-numeric:tabular-nums;text-align:center}
td.name{text-align:right;font-weight:500}
.over{color:#B3261E;font-weight:700}
:root:not([data-theme="light"]) .over{color:#FF8A80}
:root[data-theme="dark"] .over{color:#FF8A80}
.full{color:var(--accent);font-weight:700}
.pill{display:inline-block;padding:.1rem .5rem;border-radius:999px;font-size:.74rem;font-weight:700;
  background:var(--hole);border:1px solid var(--hole-b)}
.imp{display:inline-block;padding:.08rem .55rem;border-radius:999px;font-size:.72rem;font-weight:700;
  background:var(--chip);border:1px solid var(--line);color:var(--muted)}
.imp.hi{background:var(--fill);border-color:var(--fill-b);color:var(--ink)}
.sol{border:1px solid var(--line);border-radius:.6rem;padding:.7rem .85rem;background:var(--bg)}
.sollist{display:flex;flex-direction:column;gap:.6rem;margin-top:.8rem}
.sol h3{font:700 .98rem Heebo;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.sol p{color:var(--muted);font-size:.85rem;margin-top:.3rem;max-width:68ch}
.gapgrid{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.gaprow{display:grid;grid-template-columns:minmax(9rem,auto) 1fr auto;gap:.7rem;align-items:center;
  border:1px solid var(--line);border-left:4px solid var(--hole-b);border-radius:.55rem;
  padding:.55rem .8rem;background:var(--bg)}
.gaprow .where{font-weight:700;font-size:.92rem}
.gaprow .where small{display:block;color:var(--muted);font-weight:400;font-size:.76rem;margin-top:.1rem}
.gaprow .fix{font-size:.82rem;color:var(--muted)}
.gaprow .fix b{color:var(--ink);font-weight:700}
.gaprow .cands{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.25rem}
.gaprow .cand{background:var(--tln);border:1px solid var(--tln-b);border-radius:.4rem;
  padding:.05rem .45rem;font-size:.75rem;font-weight:500;color:var(--ink)}
.gaprow .none{color:var(--hole-b);font-weight:700}
.jump{border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;
  border-radius:.45rem;padding:.3rem .7rem;font:500 .8rem Heebo;white-space:nowrap}
.jump:hover{background:var(--chip)}
.jump:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hit{animation:flash 1.6s ease-out}
@keyframes flash{0%,60%{background:var(--fill);box-shadow:inset 3px 0 0 var(--fill-b)}}
.gaplist{display:flex;flex-direction:column;gap:.45rem;margin-top:.8rem}
td.sed{background:repeating-linear-gradient(45deg,transparent,transparent 6px,var(--chip) 6px,var(--chip) 7px);
  color:var(--muted);font-style:italic;border-style:dashed}
td.sed .s{font-style:italic}
details.plan{margin-top:.6rem}
details.plan summary{cursor:pointer;font:500 .85rem Heebo;color:var(--accent)}
details.plan table{min-width:0;max-width:34rem;margin-top:.5rem}
details.plan td,details.plan th{font-size:.8rem;padding:.28rem .5rem}
.ok2{color:var(--accent);font-weight:700}
.short{color:#B3261E;font-weight:700}
:root:not([data-theme="light"]) .short{color:#FF8A80}
:root[data-theme="dark"] .short{color:#FF8A80}
#legend{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem;font-size:.78rem;color:var(--muted)}
#legend span{display:inline-flex;align-items:center;gap:.3rem}
#legend i{width:.95rem;height:.95rem;border-radius:.25rem;display:inline-block;border:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){ .card{animation:up .18s ease-out} @keyframes up{from{opacity:0;transform:translateY(4px)}to{opacity:1}} }
.cmtbl td{vertical-align:top;text-align:right;min-width:120px}
.cmt{border:1px solid var(--line);border-radius:.45rem;padding:.28rem .45rem;margin:.15rem 0;font-size:.78rem;line-height:1.25}
.cmt b{display:block;font-size:.78rem}
.cmt small{color:var(--muted)}
.cm-had{background:var(--fill);border-color:var(--fill-b)}
.cm-mif{background:var(--home);border-color:var(--home-b)}
.cm-mtg{background:var(--mag);border-color:var(--mag-b)}
.cm-asp{background:var(--pe);border-color:var(--pe-b)}
.cm-mag{background:var(--tln);border-color:var(--tln-b)}
@media print{
  header,#chips,#legend,nav,.jump{display:none!important}
  body{background:#fff;color:#000;font-size:13px}
  main{max-width:none;padding:0}
  .card{border:none;box-shadow:none;page-break-inside:avoid;page-break-after:always;padding:0;margin:0 0 8px;background:#fff}
  .card:last-child{page-break-after:auto}
  .tblwrap{overflow:visible}
  table{min-width:0;width:100%}
  th,td{font-size:11px;padding:3px 2px}
  details.plan{display:none}
  .gaprow,.sol{page-break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
<header>
  <h1>לוח גורדון <small id="stamp"></small></h1>
  <nav id="tabs" role="tablist">
    <button data-v="elem" aria-pressed="true">יסודי א׳–ו׳</button>
    <button data-v="jun" aria-pressed="false">חטיבה ז׳–ט׳</button>
    <button data-v="teach" aria-pressed="false">מערכות מורים</button>
    <button data-v="gaps" aria-pressed="false">חוסרים</button>
    <button data-v="util" aria-pressed="false">ניצול שעות</button>
    <button data-v="commit" aria-pressed="false">לוח סדירויות</button>
    <button data-v="rules" aria-pressed="false">אילוצים</button>
    <button data-v="trules" aria-pressed="false">אילוצי מורים</button>
    <span style="position:relative;margin-inline-start:auto">
      <button id="expbtn" title="קובץ לייבוא למערכת אחרת" style="background:var(--fill);border-color:var(--fill-b)">📤 ייצוא קובץ</button>
      <button id="pdfbtn" style="background:var(--accent);color:var(--accent-ink);border-color:var(--accent);margin-inline-start:.3rem">📄 יצירת PDF</button>
      <button id="logoutbtn" onclick="logout()" title="החלפת משתמש" style="margin-inline-start:.3rem">🚪 יציאה</button>
      <div id="expmenu" hidden style="position:absolute;top:110%;inset-inline-end:0;z-index:9;background:var(--surface);border:1px solid var(--line);border-radius:.6rem;padding:.4rem;min-width:17rem;box-shadow:0 6px 20px rgba(0,0,0,.15);display:flex;flex-direction:column;gap:.25rem"></div>
      <div id="pdfmenu" hidden style="position:absolute;top:110%;inset-inline-end:0;z-index:9;background:var(--surface);border:1px solid var(--line);border-radius:.6rem;padding:.4rem;min-width:15rem;box-shadow:0 6px 20px rgba(0,0,0,.15);display:flex;flex-direction:column;gap:.25rem"></div>
    </span>
  </nav>
  <div id="chips"></div>
  <div id="legend">
    <span><i style="background:var(--home)"></i> מחנך/ת</span>
    <span><i style="background:var(--tln)"></i> תל״ן</span>
    <span><i style="background:var(--mag)"></i> מגמות / שירה</span>
    <span><i style="background:var(--pe)"></i> חנ״ג שכבתי</span>
    <span><i style="background:var(--fill)"></i> כיסוי ממורה חטיבה</span>
    <span><i style="background:var(--hole)"></i> חסר – מחנך/ת הכיתה נכנס/ת (זמני)</span>
    <span><i style="border:2px dashed var(--pe-b)"></i> סידור חדר אוכל</span>
  </div>
</header>
<main id="main"></main>
<script>

const EXP_COLS=[["level","רמה"],["class","כיתה"],["class_app_id","מזהה כיתה באפליקציה"],
  ["day","יום"],["day_name","שם היום"],["hour","שעה"],["subject","מקצוע"],
  ["teacher","מורה"],["teacher_full","שם מלא"],["teacher_app_id","מזהה מורה באפליקציה"],
  ["kind","סוג"],["note","הערה"],["temporary","זמני"]];
function expRow(level,cls,key,cell){
  const p=key.split(","), d=+p[0], h=+p[1];
  const k=cell.k||"", t=cell.t||"", sub=cell.s||"";
  let subject,teacher;
  if(level==="junior"){ subject=t; teacher=(k==="mag")?"":sub; }
  else{
    teacher=t; subject="";
    if(k==="tln"){ subject='תל"ן'; teacher=t.replace('תל"ן · ',""); }
    else if(k==="half"){ subject='שיעור (½ כיתה) + תל"ן (½ כיתה)'; }
    else if(k==="hole"){ subject=""; }
    else if(sub&&sub!=="חצי כיתה"){ subject=sub; }
  }
  if(!teacher&&!subject) return null;
  const AM=DATA.app_map||{classes:{},teachers:{}};
  return {level:level, class:cls, class_app_id:(AM.classes[cls]||{}).app_id||null,
    day:d, day_name:DAYS[d], hour:h, subject:subject, teacher:teacher,
    teacher_full:teacher?FN(teacher):"", teacher_app_id:(AM.teachers[teacher]||{}).app_id||null,
    kind:k||"regular", note:cell.co||"", temporary:k==="hole"};
}
function expLessons(){
  const rows=[];
  [["elementary",DATA.elem,"elem"],["junior",DATA.jun,"jun"]].forEach(([level,src,kind])=>{
    const allow=allowedClasses(kind);           // null = הכל
    for(const cls in src){
      const mine=(allow===null)||allow.includes(cls);
      for(const key in src[cls].cells){
        const r=expRow(level,cls,key,src[cls].cells[key]);
        if(!r) continue;
        // מורה שאינו מחנך מקבל את השיעורים שהוא עצמו מלמד
        if(!mine && !(USER&&r.teacher===USER.n)) continue;
        rows.push(r);
      }
    }
  });
  rows.sort((a,b)=>a.level.localeCompare(b.level)||a.class.localeCompare(b.class,"he")||a.day-b.day||a.hour-b.hour);
  return rows;
}
function expJSON(){
  return JSON.stringify({generated:DATA.built,source:"לוח גורדון",days:DAYS,
    app_map:DATA.app_map||{},full_names:DATA.full_names||{},lessons:expLessons()},null,1);
}
function expCSV(){
  const q=v=>{v=(v===null||v===undefined)?"":(v===true?"כן":(v===false?"":String(v)));
              return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const rows=expLessons();
  return "﻿"+[EXP_COLS.map(c=>q(c[1])).join(",")]
    .concat(rows.map(r=>EXP_COLS.map(c=>q(r[c[0]])).join(","))).join("\r\n")+"\r\n";
}

}

async function idHash(raw){
  const id=(raw||"").replace(/\D/g,"").padStart(9,"0");
  const enc=new TextEncoder();
  const key=await crypto.subtle.importKey("raw",enc.encode(id),"PBKDF2",false,["deriveBits"]);

}

      +'<div style="color:var(--muted);font-size:.9rem;margin-bottom:1rem">הזינו תעודת זהות לצפייה במערכת שלכם</div>'
      +'<input id="loginid" inputmode="numeric" autocomplete="off" placeholder="תעודת זהות" style="width:100%;padding:.55rem .8rem;border:1px solid var(--line);border-radius:.5rem;background:var(--bg);color:var(--ink);font-size:1.05rem;text-align:center;letter-spacing:.1em">'
      +'<button id="loginbtn" style="width:100%;margin-top:.8rem;padding:.55rem;border:none;border-radius:.5rem;background:var(--accent);color:var(--accent-ink);font:700 1rem Heebo;cursor:pointer">כניסה</button>'
      +'<div id="loginerr" style="color:#B3261E;font-size:.85rem;margin-top:.6rem;min-height:1.2em"></div></div>';
    document.body.appendChild(ov);
    const go=async()=>{
      const btn=document.getElementById("loginbtn");btn.textContent="בודק…";btn.disabled=true;
      try{
        const hsh=await idHash(document.getElementById("loginid").value);
        const e=ACCESS[hsh];
        if(e){USER=e;LS("gordon_auth",hsh);ov.remove();render();}
        else{document.getElementById("loginerr").textContent="תעודת זהות לא מוכרת - פנו למנהל/ת";}
      }catch(err){document.getElementById("loginerr").textContent="שגיאה בהזדהות: "+err;}
      btn.textContent="כניסה";btn.disabled=false;
    };
    document.getElementById("loginbtn").onclick=go;
    document.getElementById("loginid").onkeydown=e=>{if(e.key==="Enter")go();};
  }
  if(msg) document.getElementById("loginerr").textContent=msg;
  document.getElementById("loginid").focus();
}
function logout(){USER=null;LS("gordon_auth",null);showLogin();render();}
function chipRow(){
  const box=$q("#chips"); box.innerHTML="";
  if(view==="util"||view==="gaps"||view==="rules"||view==="trules"||view==="commit"){ return; }
  if(view==="teach"){
    const sel=document.createElement("select");
    let opts='<option value="">בחר/י מורה…</option>';
    for(const t of allowedTeachers()){
      opts+='<option value="'+t+'"'+(t===pick?' selected':'')+'>'+FN(t)+'</option>';
    }
    sel.innerHTML=opts;
    sel.onchange=()=>{pick=sel.value||null; render();};
    box.appendChild(sel); return;
  }
  let names=Object.keys(view==="elem"?DATA.elem:DATA.jun);
  const _ac=allowedClasses(view);
  if(_ac) names=names.filter(n=>_ac.includes(n));
  const all=document.createElement("button");
  all.textContent="הכל"; all.setAttribute("aria-pressed", pick? "false":"true");
  all.onclick=()=>{pick=null;render();}; box.appendChild(all);
  names.forEach(n=>{const b=document.createElement("button");
    b.textContent=n; b.setAttribute("aria-pressed", pick===n?"true":"false");
    b.onclick=()=>{pick=(pick===n?null:n);render();}; box.appendChild(b);});
}
function cellHtml(c,info,extraCls){
  let inner=(c.t||"");
  if(c.s) inner+='<span class="s">'+c.s+'</span>';
  if(c.co) inner+='<span class="co">'+c.co+'</span>';
  if(c.away) inner+='<span class="aw">'+info.home+' בחוץ: '+c.away+'</span>';
  return '<td class="'+extraCls+'">'+inner+'</td>';
}
function planTable(info){
  if(!info.plan||!info.plan.length) return "";
  let rows="";
  let tw=0,tg=0;
  info.plan.forEach(p=>{
    tw+=p.want; tg+=p.got;
    const diff=p.got-p.want;
    const st=diff===0?(p.miss?'<span class="short">'+p.miss+' חסר מורה</span>':'<span class="ok2">מלא</span>'):
      (diff<0?'<span class="short">חסרות '+(-diff)+'</span>':'<span class="short">עודף '+diff+'</span>');
    rows+='<tr><td class="name">'+p.n+'</td><td class="num">'+p.want+'</td><td class="num">'+p.got+'</td><td>'+st+'</td></tr>';
  });
  return '<details class="plan"><summary>תוכנית לימודים: '+tg+' מתוך '+tw+' שעות משובצות</summary>'+
    '<div class="tblwrap"><table><tr><th>מקצוע / מורה</th><th>בתוכנית</th><th>בפועל</th><th>מצב</th></tr>'+
    rows+'</table></div></details>';
}
function grid(name,info,duty){
  const H=Math.max.apply(null,info.hours);
  let rows="";
  for(let h=1;h<=H;h++){
    rows+='<tr><th>'+h+'</th>';
    DAYS.forEach((dn,d)=>{
      if(h>info.hours[d]){ rows+='<td class="k-off"></td>'; return; }
      const c=info.cells[d+","+h]||{t:""};
      const cls=(c.k?("k-"+c.k):"")+((duty&&duty===dn&&h===5)?" duty":"");
      rows+=cellHtml(c,info,cls);
    });
    rows+='</tr>';
  }
  let head='<tr><th>שעה</th>';
  DAYS.forEach(dn=>{head+='<th>'+dn+'</th>';}); head+='</tr>';
  return '<section class="card"><h2>'+name+'</h2><div class="sub">מחנך/ת: '+info.home+
    (duty?(' · סידור חדר אוכל: יום '+duty+' ש5'):'')+'</div>'+
    '<div class="tblwrap"><table>'+head+rows+'</table></div>'+planTable(info)+'</section>';
}
function teacherGrid(t){
  const ev=DATA.teachers[t]||[]; const per={};
  const sedOnly={};
  ev.forEach(e=>{const side=e[0],d=e[1],h=e[2],label=e[3];
    const key=d+","+h;
    const add=(side==="סדירות")?('◦ '+label):(label+(side!=="יסודי"?(' <span class="s">'+side+'</span>'):''));
    sedOnly[key]=(sedOnly[key]===undefined?true:sedOnly[key])&&(side==="סדירות");
    per[key]=(per[key]?per[key]+' · ':'')+add;});
  let rows="";
  for(let h=1;h<=7;h++){
    rows+='<tr><th>'+h+'</th>';
    DAYS.forEach((dn,d)=>{
      const key=d+","+h;
      const cls=(per[key]&&sedOnly[key])?' class="sed"':'';
      rows+='<td'+cls+'>'+(per[key]||'')+'</td>';});
    rows+='</tr>';
  }
  let head='<tr><th>שעה</th>';
  DAYS.forEach(dn=>{head+='<th>'+dn+'</th>';}); head+='</tr>';
  const u=(DATA.util||[]).find(z=>z.t===t);
  let sub=ev.length+' שעות בשבוע';
  if(u){
    const pct=Math.round(100*u.tot/u.q);
    const state=u.left<0?'<span class="over">חריגה של '+(-u.left)+'</span>':
                (u.left===0?'<span class="full">מכסה מלאה</span>':'נותרו '+u.left);
    sub='משובץ '+u.tot+' מתוך '+u.q+' שעות משרה ('+pct+'%) · '+state;
  }
  return '<section class="card"><h2>'+FN(t)+'</h2><div class="sub">'+sub+'</div>'+
    '<div class="tblwrap"><table>'+head+rows+'</table></div></section>';
}
function utilView(){
  let rows="";
  DATA.util.forEach(u=>{
    const cls=u.left<0?"over":(u.left===0?"full":"");
    rows+='<tr><td class="name">'+u.t+'</td>'+
      ['ye','ch','tl','mg'].map(k=>'<td class="num">'+(u[k]||"")+'</td>').join("")+
      '<td class="num"><b>'+u.tot+'</b></td><td class="num">'+u.q+'</td>'+
      '<td class="num '+cls+'">'+u.left+'</td></tr>';
  });
  const st=DATA.util.reduce((a,u)=>{a.t+=u.tot;a.q+=u.q;return a;},{t:0,q:0});
  return '<section class="card"><h2>ניצול שעות מול מכסה</h2>'+
    '<div class="sub">אדום = חריגה מהמכסה · ירוק = מכסה מלאה. סה״כ משובץ '+st.t+' מתוך '+st.q+' שעות מכסה.</div>'+
    '<div class="tblwrap"><table><tr><th>מורה</th><th>יסודי</th><th>חטיבה</th><th>תל״ן</th><th>מגמות</th>'+
    '<th>סה״כ</th><th>מכסה</th><th>נותר</th></tr>'+rows+'</table></div></section>';
}
function gapsView(){
  const g=DATA.gaps;
  const byday={};
  g.forEach(x=>{byday[x.d]=(byday[x.d]||0)+1;});
  let rows="";
  g.forEach((x,idx)=>{
    let fix="";
    if(x.cand&&x.cand.length){
      fix='<b>מורים פנויים כרגע:</b><div class="cands">'+
        x.cand.map(c=>c.ext?('<span class="cand" style="background:var(--pe);border-color:var(--pe-b)">'+c.t+' · בהגדלת משרה</span>'):('<span class="cand">'+c.t+' · נותרו '+c.left+'</span>')).join("")+'</div>';
    } else {
      fix='<span class="none">אין מורה פנוי בבית הספר בשעה זו</span>' +
          (x.lvl==="jun"?' — נדרש גיוס מורה חדש':' — נדרש שינוי במבנה: יום חופש, סדירות או מכסה');
    }
    const sub=(x.subj?x.subj+' · ':'')+(x.why||"");
    rows+='<div class="gaprow" id="gap'+idx+'">'+
      '<div class="where">'+x.c+'<small>'+x.d+' · שעה '+x.h+'</small></div>'+
      '<div class="fix">'+(sub?'<div style="margin-bottom:.25rem">'+sub+'</div>':'')+fix+'</div>'+
      '<button class="jump" data-c="'+x.c+'" data-lvl="'+x.lvl+'" data-d="'+x.d+'" data-h="'+x.h+'">'+
      'הצג במערכת ←</button></div>';
  });
  let sols="";
  DATA.sol.forEach(s2=>{
    const hi=(s2.i==="גבוהה")?" hi":"";
    sols+='<div class="sol"><h3>'+s2.t+'<span class="imp'+hi+'">'+s2.i+'</span></h3><p>'+s2.d+'</p></div>';
  });
  const dl=Object.keys(byday).map(k=>k+': '+byday[k]).join(" · ");
  return '<section class="card"><h2>'+g.length+' שעות ללא מורה</h2>'+
    '<div class="sub">'+(dl||"אין חוסרים")+' — לחיצה על "הצג במערכת" קופצת למשבצת בכיתה.</div>'+
    '<div class="gaplist">'+rows+'</div></section>'+
    '<section class="card"><h2>מהלכים רוחביים</h2>'+
    '<div class="sub">פתרונות שסוגרים כמה חוסרים בבת אחת.</div>'+
    '<div class="sollist">'+sols+'</div></section>';
}
function jumpTo(cls,lvl,dn,hr){
  view=(lvl==="jun")?"jun":"elem"; pick=cls; render();
  requestAnimationFrame(()=>{
    const di=DAYS.indexOf(dn);
    const tb=$q("#main table");
    if(!tb) return;
    const row=tb.rows[hr];
    if(!row) return;
    const cell=row.cells[di+1];
    if(!cell) return;
    cell.classList.add("hit");
    cell.scrollIntoView({block:"center",behavior:"smooth"});
  });
}
function commitView(){
  const HRS=[1,2,3,4,5,6,7];
  const kind=n=> n.indexOf("הדרכ")>=0?"cm-had": n.indexOf("מפגשה")>=0?"cm-mif":
    n.indexOf("ישיב")>=0?"cm-mtg": n.indexOf("אסיפ")>=0?"cm-asp":
    n.indexOf("ליווי")>=0?"cm-mag":"cm-oth";
  let rows="";
  for(const h of HRS){
    let tds="";
    for(let d=0;d<6;d++){
      const ev=(DATA.commit||[]).filter(e=>e.d===d&&e.h===h);
      tds+='<td>'+ev.map(e=>'<div class="cmt '+kind(e.n)+'"><b>'+e.n+'</b><small>'+e.p+'</small></div>').join("")+'</td>';
    }
    rows+='<tr><th>ש'+h+'</th>'+tds+'</tr>';
  }
  let hd="<tr><th></th>"; for(let d=0;d<6;d++) hd+="<th>"+DAYS[d]+"</th>"; hd+="</tr>";
  return '<section class="card"><h2>לוח סדירויות</h2>'+
    '<div class="sub">הדרכות, מפגשות, ישיבות ואסיפות — מתי ומי משתתף/ת.</div>'+
    '<div class="tblwrap"><table class="cmtbl">'+hd+rows+'</table></div>'+
    '<div id="legend" style="margin-top:.8rem">'+
    '<span><i class="cm-had" style="border-style:solid"></i> הדרכה</span>'+
    '<span><i class="cm-mif" style="border-style:solid"></i> מפגשה (מעגלי שיח)</span>'+
    '<span><i class="cm-mtg" style="border-style:solid"></i> ישיבה</span>'+
    '<span><i class="cm-asp" style="border-style:solid"></i> אסיפת צוות</span>'+
    
    '</div></section>';
}
function rulesView(){
  let rows="";
  DATA.rules.forEach(r=>{
    rows+='<div class="sol"><h3>'+r[0]+'</h3><p>'+r[1]+'</p></div>';
  });
  return '<section class="card"><h2>אילוצי המערכת</h2>'+
    '<div class="sub">הכללים הקבועים שהפותר מציית להם בכל ריצה.</div>'+
    '<div class="sollist">'+rows+'</div></section>';
}
function trulesView(){
  let rows="";
  DATA.trules.forEach(r=>{
    rows+='<tr><td class="name">'+r.t+'</td><td>'+r.off+'</td><td style="text-align:right">'+r.subj+'</td><td class="num">'+r.n+'</td></tr>';
  });
  return '<section class="card"><h2>אילוצי מורים</h2>'+
    '<div class="sub">ימים חופשיים, תפקידים ותחומי הוראה של כל מורה.</div>'+
    '<div class="tblwrap"><table><tr><th>מורה</th><th>ימים חופשיים</th><th>מה מלמד/ת</th><th>שעות</th></tr>'+rows+'</table></div></section>';
}
function render(){
  if(Object.keys(ACCESS).length&&!USER){showLogin();return;}
  const av=allowedViews();
  if(!av.includes(view)) view=av[0];
  if(view==="teach"&&!pick&&USER&&USER.r!=="admin"&&DATA.teachers[USER.n]) pick=USER.n;
  tabBtns(); chipRow();
  const M=$q("#main"); M.innerHTML="";
  if(view==="util"){ M.innerHTML=utilView(); return; }
  if(view==="commit"){ M.innerHTML=commitView(); return; }
  if(view==="rules"){ M.innerHTML=rulesView(); return; }
  if(view==="trules"){ M.innerHTML=trulesView(); return; }
  if(view==="gaps"){
    M.innerHTML=gapsView();
    M.querySelectorAll(".jump").forEach(b=>{
      b.onclick=()=>jumpTo(b.dataset.c,b.dataset.lvl,b.dataset.d,+b.dataset.h);
    });
    return;
  }
  if(view==="teach"){
    M.innerHTML = pick ? teacherGrid(pick) :
      '<section class="card"><h2>מערכות מורים</h2><div class="sub">בחר/י מורה מהרשימה למעלה כדי לראות את השבוע המלא — יסודי, חטיבה ותל״ן יחד.</div></section>';
    return;
  }
  const src=view==="elem"?DATA.elem:DATA.jun;
  let names=pick?[pick]:Object.keys(src);
  const _ac2=allowedClasses(view);
  if(_ac2) names=names.filter(n=>_ac2.includes(n));
  M.innerHTML=names.map(n=>grid(n,src[n],src[n].duty)).join("");
}
$q("#stamp").textContent="עודכן "+(DATA.built||"");
(function(){
  if(!Object.keys(ACCESS).length){render();return;}
  const saved=LS("gordon_auth");
  if(saved&&ACCESS[saved]){USER=ACCESS[saved];render();}
  else{showLogin();}
})();
</script>
