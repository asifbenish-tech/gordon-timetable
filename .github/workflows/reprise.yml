# CI for the Reprise game in reprise/ only. It never runs for the timetable's own files.
name: reprise
on:
  push:
    paths: ["reprise/**", ".github/workflows/reprise.yml"]
  pull_request:
    paths: ["reprise/**", ".github/workflows/reprise.yml"]
defaults:
  run:
    working-directory: reprise
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: reprise/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - run: npm run build:loom
  bot:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: reprise/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run bot
        env:
          BOT_SEEDS: 50
