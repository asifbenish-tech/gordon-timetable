<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>לוח שמירות · גורדון</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Frank+Ruhl+Libre:wght@700&display=swap">
<style>
:root{
  --bg:#FAF9F6; --surface:#FFFFFF; --ink:#22303D; --muted:#6B7A88; --line:#E3E0D8;
  --accent:#0E6E66; --accent-ink:#FFFFFF; --chip:#EFECE4;
  --mine:#FFF1C2; --mine-b:#E0B400; --today:#E6F3F1; --warn:#B3261E; --warn-bg:#FBE4E1; --band:#F1EEE6; --off:#F3F1EC;
  --ok:#2E7D32;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141B22; --surface:#1C2530; --ink:#E8EDF2; --muted:#93A1AE; --line:#2C3742;
    --accent:#3FB8AC; --accent-ink:#0E1A18; --chip:#242E39;
    --mine:#5A4A00; --mine-b:#E0B400; --today:#17302E; --warn:#FF8A80; --warn-bg:#43231F; --band:#222C37; --off:#19212A;
    --ok:#81C784;
  }
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Heebo,"Segoe UI",Arial,sans-serif;direction:rtl}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:.9rem 1.2rem .7rem}
.top{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap}
h1{font:700 1.5rem "Frank Ruhl Libre",Heebo,serif}
#who{color:var(--muted);font-size:.85rem;margin-inline-start:auto}
#who a,#who button{color:var(--accent);background:none;border:none;font:inherit;cursor:pointer;text-decoration:underline;padding:0;margin-inline-start:.6rem}
nav{display:flex;gap:.4rem;margin-top:.7rem;flex-wrap:wrap;align-items:center}
nav button,.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:.35rem .9rem;border-radius:999px;font:500 .9rem Heebo;cursor:pointer}
nav button[aria-pressed="true"],.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.55;cursor:default}
select,input[type=text],input[type=time],input[type=number],input[type=search]{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.3rem .6rem;border-radius:.5rem;font:500 .9rem Heebo}
main{padding:1rem 1.2rem 4rem;max-width:1080px;margin:0 auto}
main.wide{max-width:1360px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:.75rem;padding:1rem 1.1rem;margin-top:1rem}
.card h2{font:700 1.15rem "Frank Ruhl Libre",Heebo,serif}
.sub{color:var(--muted);font-size:.85rem;margin-top:.15rem}
.time{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.none{color:var(--muted)}
.err{color:var(--warn)}
.note{background:var(--band);border-radius:.5rem;padding:.5rem .8rem;font-size:.85rem;margin-top:.8rem}
/* השמירות שלי */
.next{border-color:var(--accent);border-width:2px}
.next .big{font:700 1.25rem Heebo;margin-top:.25rem}
.dayrow{display:grid;grid-template-columns:5.5rem 1fr;gap:.2rem .8rem;padding:.65rem 0;border-top:1px solid var(--line)}
.dayrow:first-of-type{border-top:none}
.dayrow.today .dname{color:var(--accent)}
.dname{font-weight:700}
.duty{display:flex;gap:.6rem;flex-wrap:wrap;align-items:baseline;padding:.1rem 0}
.duty .time{font-weight:700;min-width:6.2rem}
.duty .with{color:var(--muted);font-size:.85rem}
/* טבלאות הלוח */
.tblwrap{overflow-x:auto;margin-top:.7rem}
table{border-collapse:collapse;width:100%}
table.grid{min-width:680px}
th,td{border:1px solid var(--line);padding:.42rem .5rem;text-align:center;font-size:.88rem;vertical-align:middle}
thead th{background:var(--band);font-weight:700}
th.spot{text-align:start;font-weight:500;min-width:9.5rem;background:var(--surface)}
th.today,td.today{background:var(--today)}
td.off{background:var(--off);color:var(--muted)}
td.mine{background:var(--mine);box-shadow:inset 0 0 0 2px var(--mine-b)}
td .p{display:block;white-space:nowrap}
td .p.me{font-weight:700}
td .p.away{color:var(--warn)}
td .p.unl{text-decoration:underline dotted var(--muted);text-underline-offset:3px}
td.ed{cursor:pointer;min-width:5.5rem}
td.ed:hover{box-shadow:inset 0 0 0 2px var(--accent)}
td.miss{background:var(--warn-bg)}
td.miss .need{color:var(--warn);font-size:.78rem;display:block}
td.dim{opacity:.45}
.bhead{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap}
/* מסך הסידור */
.steps{display:flex;gap:.4rem;flex-wrap:wrap}
.deft td,.deft th{font-size:.9rem;padding:.35rem .4rem}
.deft input[type=text]{width:100%;min-width:7rem}
.deft input[type=number]{width:3.6rem;text-align:center}
.deft .days label{display:inline-flex;flex-direction:column;align-items:center;font-size:.72rem;color:var(--muted);margin:0 .12rem;cursor:pointer}
.ic{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:.4rem;padding:.1rem .45rem;font-size:.85rem;cursor:pointer}
.ic.del{color:var(--warn)}
input[type=checkbox]{width:1.05rem;height:1.05rem;accent-color:var(--accent);cursor:pointer}
.asg{display:grid;grid-template-columns:minmax(0,1fr) 17rem;gap:1rem;align-items:start}
.panel{position:sticky;top:7.2rem;background:var(--surface);border:1px solid var(--line);border-radius:.75rem;padding:.8rem;margin-top:1rem;max-height:calc(100vh - 12rem);display:flex;flex-direction:column}
.panel input[type=search]{width:100%;margin:.5rem 0}
.plist{overflow-y:auto;flex:1;min-height:6rem}
.prow{display:flex;align-items:center;gap:.4rem;width:100%;border:none;background:none;color:var(--ink);font:500 .9rem Heebo;padding:.3rem .4rem;border-radius:.45rem;cursor:pointer;text-align:start}
.prow:hover{background:var(--band)}
.prow[aria-pressed="true"]{background:var(--mine);box-shadow:inset 0 0 0 2px var(--mine-b)}
.prow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{background:var(--chip);border-radius:999px;min-width:1.5rem;text-align:center;font-size:.8rem;padding:0 .35rem;font-weight:700}
.badge.zero{background:var(--warn-bg);color:var(--warn)}
.dots{display:inline-flex;gap:2px;direction:rtl}
.dots i{width:.42rem;height:.42rem;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--accent)}
.selbar{background:var(--mine);border:1px solid var(--mine-b);border-radius:.6rem;padding:.5rem .8rem;margin-top:1rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;font-size:.9rem}
.stat{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}
.stat span{background:var(--surface);border:1px solid var(--line);border-radius:.6rem;padding:.3rem .7rem;font-size:.88rem}
.stat span.bad{border-color:var(--warn);color:var(--warn)}
.stat span.good{border-color:var(--ok);color:var(--ok)}
.issues li{margin:.2rem 1.2rem 0 0;font-size:.9rem}
#bar{position:sticky;bottom:0;z-index:6;background:var(--surface);border-top:2px solid var(--accent);padding:.6rem 1.2rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
#bar .msg{flex:1;min-width:10rem;font-size:.9rem}
dialog{border:1px solid var(--line);border-radius:.9rem;background:var(--surface);color:var(--ink);padding:1.2rem 1.3rem;width:min(28rem,94vw);max-height:88vh;margin:auto}
dialog::backdrop{background:rgba(0,0,0,.4)}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin:.7rem 0;min-height:2rem}
.chipx{background:var(--chip);border-radius:999px;padding:.2rem .3rem .2rem .7rem;display:inline-flex;align-items:center;gap:.3rem}
.chipx button{border:none;background:none;color:var(--warn);font-size:1rem;cursor:pointer;line-height:1;padding:0 .3rem}
.cands{max-height:42vh;overflow-y:auto;border:1px solid var(--line);border-radius:.6rem;padding:.3rem}
.cands h4{font:700 .78rem Heebo;color:var(--muted);padding:.4rem .4rem .1rem}
.cands .prow .why{color:var(--muted);font-size:.75rem}
.addrow{display:flex;gap:.4rem;margin-top:.6rem}.addrow input{flex:1;min-width:0}
.dfoot{display:flex;gap:.5rem;margin-top:1rem}
@media (max-width:900px){ .asg{grid-template-columns:1fr} .panel{position:static;max-height:15rem;order:-1} }
@media (max-width:600px){ header{padding:.7rem .8rem .6rem} main{padding:.6rem .8rem 4rem} h1{font-size:1.25rem}
  .dayrow{grid-template-columns:4.2rem 1fr} }
@media print{ header nav,#who,#bar,.noprint{display:none!important} header{position:static} .card{break-inside:avoid;border:none;padding:0}
  table.grid{min-width:0} body{background:#fff} }
</style>
</head>
<body>
<header>
  <div class="top"><h1>🛡️ לוח שמירות</h1><span class="sub" id="ttl"></span><span id="who"></span></div>
  <nav id="nav"></nav>
</header>
<main id="main"><p class="sub" style="margin-top:2rem;text-align:center">טוען…</p></main>
<div id="bar" hidden></div>
<dialog id="dlg"></dialog>

<script>
"use strict";
// ================= הגדרות =================
// USERS_API: אותו שרת משתמשים של לוח המערכות (שינויים חיים ברשימת הנכנסים).
// DUTY_API: כתובת ה-Web App של shmira_admin/Code.gs. ריק = הלוח מוצג מהנתונים המוטבעים,
//           והסידור נשמר רק במכשיר של העורך (מצב ניסיון).
const USERS_API="https://script.google.com/macros/s/AKfycbwJyZr8roh7yF0P32iXu2MgMoz95K62urGr_BAVOeAsWhMjqP-J3JQP87XKZanTpxNI/exec";
const DUTY_API="";
const EDITORS=["חסן","אסיף"];           // מי רשאי לסדר את הלוח (לפי שם המשתמש ברשימת הנכנסים)
const DAYS=["ראשון","שני","שלישי","רביעי","חמישי","שישי"];
// שם כפי שנכתב באקסל / הוקלד ידנית -> שם איש הצוות במערכת (כמו במערכת השעות וברשימת הנכנסים)
const ALIAS={"אורנה לוי":"אורנה","אלי מור":"אלי","עדי אבן טוב":"עדי שם טוב","גלית ז":"גלית זינגר","גלית ב":"גלית",
  "גלית בצלאל":"גלית","נועה חמו":"נועה","הילית שטרן":"הילית","סימה דוד":"סימה","הדר קורצויל":"הדר","חגית אבידן":"חגית",
  "שחר ש":"שחר","שחר שלייסר":"שחר","ליאור שפירא":"לי-אור","ליאור":"לי-אור","נעמי קציר":"נעמי","טלי ברינברג":"טלי",
  "מירי קריימר":"מירי","מירי קרימר":"מירי","דניאל צאל":"דניאל","חסאן":"חסן","שיר אופיר":"שיר"};
// איך להציג שם (להבדיל בין שמות פרטיים זהים)
const LABEL={"אורנה":"אורנה לוי","גלית":"גלית ב","גלית זינגר":"גלית ז","לי-אור":"ליאור שפירא","שיר":"שיר אופיר"};

// הלוח המקורי (תורנות שמירה תשפ"ז 26/27). [שעה, אחרי איזה שיעור, [אזור, ראשון|שני|...|שישי]], "/" = שניים באותה עמדה.
// מבנה הלוח: zones = אזורי שמירה (need = כמה שומרים נדרשים), breaks = הפסקות (after = אחרי איזה שיעור,
// days = באילו ימים, zones = אילו אזורים מאוישים), a = שיבוץ: "הפסקה|אזור|יום" -> שמות.
const DEFAULT=(function(){
  const src=[
   ["7:45-8:10",0,"לפני הלימודים",[
    ["חצר מתקנים","|||||"],
    ["מגרשים/רחבה בניין החדש","יפעת|יפעת|אורנה לוי|אלי מור|יעל|צבי"]]],
   ["9:40-10:00",2,"",[
    ["חצר שומר ומסדרונות קומת כניסה","עדי אבן טוב|גלית ז|אסיף|דני|נועה חמו|לייה"],
    ["רחבה בניין חדש","הילית שטרן|תדהר|סימה דוד|פנינה|הדר קורצויל|פנינה"],
    ["חצר מתקנים","יערה|חגית אבידן|אנה|פאני|מאמי|צופיה"],
    ["מגרש כדורסל","חסן/תמיר|שחר ש/פאני|מרים/תדהר|ארז|ליאור שפירא|שיר אופיר"],
    ["מגרש כדורגל","חסן/תמיר|שחר ש/פאני|מרים/תדהר|ארז|ליאור שפירא|שיר אופיר"],
    ["קומת יסודי","|||||"]]],
   ["11:30-11:50",4,"",[
    ["חצר שומר ומסדרונות קומת כניסה","גלית ז|אלי מור|לילך|תמיר|אסיף|"],
    ["רחבה בניין חדש","נעמי קציר|הילית שטרן|עינת|שרית|חגית אבידן|"],
    ["חצר מתקנים","גלית ב|תניה|טלי ברינברג|תניה|מרים|"],
    ["מגרש כדורסל","אורנה לוי|אורנה מאיר|שרית|גלית ב|חסן|"],
    ["מגרש כדורגל","אורנה לוי|אורנה מאיר|שרית|גלית ב|חסן|"],
    ["קומת יסודי","|||||"]]],
   ["12:35-12:55",5,"",[
    ["חצר שומר ומסדרונות קומת כניסה","אינס|דני|צבי|צופיה|נעמי קציר|"],
    ["רחבה בניין חדש","אורנה מאיר|דליה|הילה|מירי קריימר|דניאל צאל|"],
    ["חצר מתקנים","עינת|מירי קריימר|דליה|אינס|לייה|"],
    ["מגרש כדורסל","לילך/נועה חמו|דניאל צאל|ליאור שפירא|סימה דוד|יערה|"],
    ["מגרש כדורגל","לילך/נועה חמו|דניאל צאל|ליאור שפירא|סימה דוד|יערה|"],
    ["קומת יסודי","|||||"]]]];
  const B={v:2,title:"תורנות שמירה תשפ״ז",zones:[],breaks:[],a:{}}, zid={};
  src.forEach(([time,after,name,rows],bi)=>{
    const bk={id:"b"+(bi+1),name,time,after,days:[1,1,1,1,1,bi<2?1:0],zones:[]};
    rows.forEach(([zn,row])=>{
      if(!zid[zn]){ zid[zn]="z"+(B.zones.length+1); B.zones.push({id:zid[zn],name:zn,need:zn==="קומת יסודי"?0:1}); }
      bk.zones.push(zid[zn]);
      row.split("|").forEach((c,d)=>{ if(c) B.a[bk.id+"|"+zid[zn]+"|"+d]=c.split("/").map(p=>ALIAS[p]||p); });
    });
    B.breaks.push(bk);
  });
  return B;
})();

// ================= עזרים =================
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS=(k,v)=>{try{return v===undefined?localStorage.getItem(k):(v===null?localStorage.removeItem(k):localStorage.setItem(k,v));}catch(e){return null;}};
const clone=o=>JSON.parse(JSON.stringify(o));
const clean=s=>String(s||"").replace(/[<>"`\\|]/g,"").replace(/\s+/g," ").trim().slice(0,40);
const canon=p=>ALIAS[p]||p;
const disp=p=>LABEL[p]||p;
const he=(a,b)=>a.localeCompare(b,"he");
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const today=()=>new Date().getDay();   // 0=ראשון … 5=שישי, 6=שבת
const tStart=t=>{ const m=/(\d{1,2})[:.](\d{2})/.exec(t||""); return m?(+m[1])*60+(+m[2]):0; };
function jsonp(api,params,ms){
  return new Promise((res,rej)=>{
    const cb="__gs"+Date.now().toString(36)+Math.random().toString(36).slice(2,7), sc=document.createElement("script");
    const done=()=>{try{delete window[cb];}catch(e){window[cb]=undefined;} sc.remove(); clearTimeout(t);};
    const t=setTimeout(()=>{done();rej(new Error("השרת לא ענה"));},ms||10000);
    window[cb]=d=>{done();res(d);};
    const q=Object.entries(Object.assign({},params,{callback:cb})).map(([k,v])=>encodeURIComponent(k)+"="+encodeURIComponent(v)).join("&");
    sc.src=api+(api.includes("?")?"&":"?")+q; sc.onerror=()=>{done();rej(new Error("אין חיבור לשרת"));};
    document.head.appendChild(sc);
  });
}

// ================= הזדהות - אותה רשימה ואותו גיבוב כמו לוח המערכות =================
let ACCESS_BASE={}, ACCESS={}, USER=null, USER_H=null, USERS_LIVE=null;
(function(){   // קישור העריכה מהמייל: ?skey=... נשמר במכשיר ונמחק מהכתובת
  try{const u=new URL(location.href),k=u.searchParams.get("skey");
    if(k){LS("gordon_skey",k);u.searchParams.delete("skey");history.replaceState(null,"",u.pathname+u.search+u.hash);}}catch(e){}
})();
async function loadAccess(){
  try{ ACCESS_BASE=await (await fetch("access_map.json?v="+Date.now(),{cache:"no-store"})).json(); }catch(e){ ACCESS_BASE={}; }
  ACCESS=Object.assign({},ACCESS_BASE);
}
const usersReady=(async()=>{
  if(!USERS_API) return;
  await null;
  try{ const d=await jsonp(USERS_API,{});
    if(d&&d.ok){ const a=Object.assign({},ACCESS_BASE); Object.keys(d.removed||{}).forEach(h=>{delete a[h];}); Object.assign(a,d.users||{}); USERS_LIVE=a; }
  }catch(e){}
})();
const waitUsers=()=>Promise.race([usersReady,new Promise(r=>setTimeout(r,6000))]).then(()=>{ if(USERS_LIVE) ACCESS=Object.assign({},ACCESS_BASE,USERS_LIVE); });
async function idHash(raw){
  const id=(raw||"").replace(/\D/g,"").padStart(9,"0"), enc=new TextEncoder();
  const key=await crypto.subtle.importKey("raw",enc.encode(id),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:enc.encode("gordon-lohot-2026"),iterations:100000},key,256);
  return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
function setUser(h){ USER_H=h||null; USER=h?ACCESS[h]:null; LS("gordon_auth",h||null); }
function showLogin(msg){
  let ov=$("loginov");
  if(!ov){
    ov=document.createElement("div"); ov.id="loginov";
    ov.style.cssText="position:fixed;inset:0;z-index:99;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:1rem";
    ov.innerHTML='<div style="background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:2rem 2.2rem;max-width:22rem;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.12)">'
      +'<div style="font-size:2rem">🛡️</div><h2 style="margin:.4rem 0">לוח שמירות · גורדון</h2>'
      +'<div style="color:var(--muted);font-size:.9rem;margin-bottom:1rem">הזינו תעודת זהות כדי לראות איפה ומתי אתם שומרים</div>'
      +'<input id="loginid" type="text" inputmode="numeric" autocomplete="off" placeholder="תעודת זהות" style="width:100%;padding:.55rem .8rem;font-size:1.05rem;text-align:center;letter-spacing:.1em">'
      +'<button id="loginbtn" class="btn pri" style="width:100%;margin-top:.8rem;padding:.55rem;border-radius:.5rem;font-weight:700;font-size:1rem">כניסה</button>'
      +'<div id="loginerr" class="err" style="font-size:.85rem;margin-top:.6rem;min-height:1.2em"></div></div>';
    document.body.appendChild(ov);
    const go=async()=>{
      const btn=$("loginbtn"); btn.textContent="בודק…"; btn.disabled=true;
      try{

let TT=null, TTERR="";    // מערכות המורים (מי בבית הספר באיזה יום ושעה) - נטען רק במסך הסידור
const canEdit=()=>!!(USER&&EDITORS.includes(USER.n));
const hasKey=()=>!!LS("gordon_skey");
function valid(b){ return !!(b&&b.v===2&&Array.isArray(b.zones)&&Array.isArray(b.breaks)&&b.a&&typeof b.a==="object"
  &&b.zones.every(z=>z&&z.id)&&b.breaks.every(k=>k&&k.id&&Array.isArray(k.days)&&k.days.length===6&&Array.isArray(k.zones))); }
async function loadBoard(){
  if(DUTY_API){
    try{ const d=await jsonp(DUTY_API,{});
      if(d&&d.ok){ LOADERR=""; REV=d.rev||0; if(valid(d.board)){BOARD=d.board;SRC="server";} else {BOARD=clone(DEFAULT);SRC="embedded";} }
      else LOADERR=(d&&d.error)||"תשובה לא צפויה מהשרת";
    }catch(e){ LOADERR=e.message; }
  } else {
    try{ const l=JSON.parse(LS("gordon_shmira_local2")||"null"); if(valid(l)){BOARD=l;SRC="local";} }catch(e){}
  }
}
const cellOf=(B,b,z,d)=>B.a[b+"|"+z+"|"+d]||[];
const zonesOf=(B,bk)=>B.zones.filter(z=>bk.zones.includes(z.id));
// כל התאים הפעילים בלוח: f({bk,z,d,c})
function eachCell(B,f){ B.breaks.forEach(bk=>zonesOf(B,bk).forEach(z=>{ for(let d=0;d<6;d++) if(bk.days[d]) f({bk,z,d,c:cellOf(B,bk.id,z.id,d)}); })); }
// כל השמירות של אדם: [{d,time,name,spots:[..],with:[..]}]
function dutiesOf(B,name){
  const m={};
  eachCell(B,({bk,z,d,c})=>{ if(!c.includes(name)) return;
    const k=bk.id+"|"+d, x=m[k]||(m[k]={d,time:bk.time,name:bk.name,spots:[],w:new Set()});
    x.spots.push(z.name); c.forEach(p=>{ if(p!==name) x.w.add(disp(p)); }); });
  return Object.values(m).map(x=>({d:x.d,time:x.time,name:x.name,spots:x.spots,with:[...x.w]}));
}
function counts(B){ const s={}; eachCell(B,({bk,d,c})=>c.forEach(p=>{ (s[p]||(s[p]=new Set())).add(bk.id+"|"+d); })); const o={}; for(const p in s) o[p]=s[p].size; return o; }
function people(B){ const s=new Set(); eachCell(B,({c})=>c.forEach(p=>s.add(p))); return s; }
const userNames=()=>[...new Set(Object.values(ACCESS).map(e=>e.n))];
// השמטת שיבוצים של הפסקות/אזורים שנמחקו או שאינם פעילים
function prune(B){
  const zs=new Set(B.zones.map(z=>z.id)), bm={}; B.breaks.forEach(k=>{ k.zones=k.zones.filter(z=>zs.has(z)); bm[k.id]=k; });
  for(const key of Object.keys(B.a)){ const [b,z,d]=key.split("|"), k=bm[b];
    if(!k||!k.zones.includes(z)||!k.days[+d]||!B.a[key].length) delete B.a[key]; }
}

async function loadTT(){
  if(TT) return;
  try{ const j=await (await fetch("timetable.json?v="+Date.now(),{cache:"no-store"})).json(); const T={};
    for(const n in (j.teachers||{})){ if(NOT_STAFF.includes(n)) continue; const days=[0,1,2,3,4,5].map(()=>new Set()); j.teachers[n].forEach(ev=>{ if(days[ev[1]]) days[ev[1]].add(ev[2]); }); T[n]=days; }
    TT=T; TTERR="";
  }catch(e){ TT={}; TTERR="לא הצלחתי לטעון את מערכת השעות - אין מידע על נוכחות"; }
}
// 2 = מלמד/ת בצמוד להפסקה, 1 = בבית הספר ביום הזה, 0 = לא בבית הספר, -1 = אין מערכת (לא ידוע)
function presence(n,d,after){ const t=TT&&TT[n]; if(!t) return -1; if(!t[d].size) return 0; return (t[d].has(after)||t[d].has(after+1))?2:1; }
function staffList(B){ return [...new Set([...Object.keys(TT||{}),...userNames(),...people(B)])].sort((a,b)=>he(disp(a),disp(b))); }

function issues(B){
  const miss=[], away=[], cnt=counts(B);

  return {miss,away,idle,cnt};

    +'<input type="search" id="pq" placeholder="חיפוש שם"><div class="plist">'
    +S.map(p=>{ const c=I.cnt[p]||0, t=TT&&TT[p];
      return '<button class="prow" data-act="sel" data-p="'+esc(p)+'" data-nm="'+esc(disp(p))+'" aria-pressed="'+(SEL===p)+'"><span class="nm">'+esc(disp(p))+'</span>'
        +(t?'<span class="dots">'+t.map(s=>'<i'+(s.size?' class="on"':"")+'></i>').join("")+'</span>':"")
        +'<span class="badge'+(c?"":" zero")+'">'+c+'</span></button>'; }).join("")
    +'</div></aside></div>';
  return h;
}
function toggle(b,z,d,p){
  const key=b+"|"+z+"|"+d, c=(DRAFT.a[key]||[]).slice(), i=c.indexOf(p);
  if(i>=0) c.splice(i,1); else { if(c.length>=8) return; c.push(p); }
  if(c.length) DRAFT.a[key]=c; else delete DRAFT.a[key];
  touch();
}
function cellDialog(b,z,d){
  const dlg=$("dlg"), B=DRAFT, bk=B.breaks.find(k=>k.id===b), zn=B.zones.find(x=>x.id===z), key=b+"|"+z+"|"+d;
  const draw=()=>{
    const cur=B.a[key]||[], cnt=counts(B), busy={};
    zonesOf(B,bk).forEach(o=>{ if(o.id!==z) cellOf(B,b,o.id,d).forEach(p=>{ busy[p]=o.name; }); });
    const G=[["מלמדים בצמוד להפסקה",[]],["בבית הספר ביום הזה",[]],["אין מערכת שעות (לא ידוע)",[]],["לא בבית הספר ביום הזה",[]]];
    staffList(B).filter(p=>!cur.includes(p)).forEach(p=>{ const pr=presence(p,d,bk.after); G[pr===2?0:pr===1?1:pr===-1?2:3][1].push(p); });
    G.forEach(g=>g[1].sort((x,y)=>(cnt[x]||0)-(cnt[y]||0)||he(disp(x),disp(y))));
    dlg.innerHTML='<h2 style="font:700 1.1rem Heebo">'+esc(zn.name)+'</h2><div class="sub">יום '+DAYS[d]+' · <span class="time">'+esc(bk.time)+'</span>'+(zn.need>1?" · נדרשים "+zn.need:"")+'</div>'
      +'<div class="chips">'+(cur.length?cur.map(p=>'<span class="chipx">'+esc(disp(p))+'<button data-rm="'+esc(p)+'" aria-label="הסרת '+esc(disp(p))+'">×</button></span>').join(""):'<span class="none">אין שומר/ת</span>')+'</div>'
      +'<div class="cands">'+G.filter(g=>g[1].length).map(g=>'<h4>'+g[0]+'</h4>'+g[1].map(p=>'<button class="prow" data-add="'+esc(p)+'"><span class="nm">'+esc(disp(p))
          +(busy[p]?' <span class="why">· כבר ב'+esc(busy[p])+'</span>':"")+'</span><span class="badge'+(cnt[p]?"":" zero")+'">'+(cnt[p]||0)+'</span></button>').join("")).join("")+'</div>'
      +'<div class="addrow"><input type="text" id="padd" placeholder="שם שאינו ברשימה" autocomplete="off"><button class="btn" id="paddb">הוספה</button></div>'
      +'<div class="dfoot"><button class="btn pri" id="pok">סגירה</button></div>';
    dlg.querySelectorAll("[data-rm]").forEach(x=>x.onclick=()=>{ toggle(b,z,d,x.dataset.rm); draw(); });
    dlg.querySelectorAll("[data-add]").forEach(x=>x.onclick=()=>{ const st=dlg.querySelector(".cands").scrollTop; toggle(b,z,d,x.dataset.add); draw(); dlg.querySelector(".cands").scrollTop=st; });
    const add=()=>{ const v=canon(clean($("padd").value)); if(v&&!(B.a[key]||[]).includes(v)) toggle(b,z,d,v); draw(); };
    $("paddb").onclick=add; $("padd").onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); add(); } };
    $("pok").onclick=()=>dlg.close();
  };
  dlg.onclose=()=>render();
  draw(); dlg.showModal();
}

// ---- אירועים במסך הסידור (האזנה אחת על main) ----
const touch=()=>{ DIRTY=true; BARMSG=""; };
$("main").addEventListener("click",e=>{
  if(!EDIT) return;
  const t=e.target.closest("[data-act]"); if(!t) return;
  const B=DRAFT, a=t.dataset.act, i=+t.dataset.i;
  if(a==="cell"){ const {b,z,d}=t.dataset; if(SEL){ toggle(b,z,+d,SEL); render(); } else cellDialog(b,z,+d); return; }
  if(a==="sel"){ SEL=SEL===t.dataset.p?null:t.dataset.p; render(); return; }
  if(a==="unsel"){ SEL=null; render(); return; }
  if(a==="badd"){ const last=B.breaks[B.breaks.length-1];
    B.breaks.push({id:newId("b"),name:"",time:"10:00-10:20",after:2,days:[1,1,1,1,1,0],zones:last?last.zones.slice():B.zones.map(z=>z.id)}); }
  else if(a==="bdel"){ const k=B.breaks[i]; if(hasAssign(B,p=>p[0]===k.id)&&!confirm("למחוק את ההפסקה "+k.time+" עם כל השיבוצים שבה?")) return; B.breaks.splice(i,1); }
  else if(a==="zadd"){ B.zones.push({id:newId("z"),name:"אזור חדש",need:1}); }
  else if(a==="zdel"){ const z=B.zones[i]; if(hasAssign(B,p=>p[1]===z.id)&&!confirm('למחוק את האזור "'+z.name+'" עם כל השיבוצים שבו?')) return; B.zones.splice(i,1); }
  else if(a==="zmv"){ const j=i+(+t.dataset.dir); if(j<0||j>=B.zones.length) return; [B.zones[i],B.zones[j]]=[B.zones[j],B.zones[i]]; }
  else return;
  prune(B); touch(); render();
  if(a==="zadd"){ const inp=document.querySelector('[data-f="zname"][data-i="'+(B.zones.length-1)+'"]'); if(inp){ inp.focus(); inp.select(); } }
});
$("main").addEventListener("keydown",e=>{ if(EDIT&&(e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("td[data-act]")){ e.preventDefault(); e.target.click(); } });
$("main").addEventListener("change",e=>{
  if(!EDIT) return;
  const t=e.target, f=t.dataset&&t.dataset.f; if(!f) return;
  const B=DRAFT, i=+t.dataset.i, k=B.breaks[i]; let re=false;
  if(f==="title") B.title=clean(t.value);
  else if(f==="bname"){ k.name=clean(t.value); }
  else if(f==="bt0"||f==="bt1"){ const p=[tOut(tIn(k.time,0)),tOut(tIn(k.time,1))]; p[f==="bt0"?0:1]=tOut(t.value); k.time=p[0]+"-"+p[1]; }
  else if(f==="bafter") k.after=+t.value;
  else if(f==="bday"){ const j=+t.dataset.j;
    if(!t.checked&&hasAssign(B,p=>p[0]===k.id&&+p[2]===j)&&!confirm("ביום "+DAYS[j]+" כבר יש שיבוצים בהפסקה הזו. לבטל את היום ולמחוק אותם?")){ t.checked=true; return; }
    k.days[j]=t.checked?1:0; }
  else if(f==="bz"){ const z=t.dataset.z;
    if(!t.checked&&hasAssign(B,p=>p[0]===k.id&&p[1]===z)&&!confirm("באזור הזה כבר יש שיבוצים בהפסקה הזו. להסיר אותו ולמחוק אותם?")){ t.checked=true; return; }
    k.zones=t.checked?[...k.zones,z]:k.zones.filter(x=>x!==z); }
  else if(f==="zname"){ B.zones[i].name=clean(t.value)||"אזור"; re=true; }
  else if(f==="zneed") B.zones[i].need=Math.max(0,Math.min(4,Math.round(+t.value)||0));
  else return;
  prune(B); touch(); if(re||f==="bt0"||f==="bt1"||f==="bname") render(); else renderBar();
});

function renderBar(){
  const bar=$("bar"); bar.hidden=!EDIT; if(!EDIT) return;
  bar.innerHTML='<span class="msg">'+(BARMSG?'<span class="err">'+esc(BARMSG)+'</span>':DIRTY?"יש שינויים שלא נשמרו":"מסך הסידור - אין שינויים")+'</span>'
    +'<button class="btn" id="ecancel"'+(SAVING?" disabled":"")+'>'+(DIRTY?"ביטול השינויים":"חזרה ללוח")+'</button>'
    +'<button class="btn pri" id="esave"'+(SAVING||!DIRTY?" disabled":"")+'>'+(SAVING?"שומר…":"שמירה ופרסום לצוות")+'</button>';
  $("ecancel").onclick=()=>{ if(DIRTY&&!confirm("לבטל את כל השינויים שלא נשמרו?")) return; EDIT=false; DRAFT=null; DIRTY=false; BARMSG=""; SEL=null; VIEW="all"; render(); };
  $("esave").onclick=save;
}
async function startEdit(){
  if(DUTY_API&&!hasKey()){ alert("כדי לסדר את הלוח צריך לפתוח פעם אחת במכשיר הזה את קישור העריכה שנשלח במייל."); return; }
  await loadTT();
  DRAFT=clone(BOARD); DIRTY=false; BARMSG=""; SEL=null; ETAB="asg"; EDIT=true; render();
}
async function save(){
  prune(DRAFT);
  const done=()=>{ BOARD=DRAFT; EDIT=false; DRAFT=null; DIRTY=false; SEL=null; VIEW="all"; render(); };
  if(!DUTY_API){ LS("gordon_shmira_local2",JSON.stringify(DRAFT)); SRC="local"; done(); return; }
  SAVING=true; BARMSG=""; renderBar();
  const sent=JSON.stringify(DRAFT); let res=null;
  try{ const r=await fetch(DUTY_API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},redirect:"follow",
        body:JSON.stringify({key:LS("gordon_skey"),name:USER.n,rev:REV,board:DRAFT})}); res=await r.json(); }catch(e){ res=null; }
  if(!res){   // התשובה לא נקראה (דפדפן/רשת) - בודקים מול השרת אם השמירה נקלטה
    try{ const d=await jsonp(DUTY_API,{}); if(d&&d.ok&&JSON.stringify(d.board)===sent) res={ok:true,rev:d.rev}; }catch(e){}
  }
  SAVING=false;
  if(res&&res.ok){ REV=res.rev||REV+1; SRC="server"; done(); }
  else { BARMSG=(res&&res.error)||"השמירה נכשלה - בדקו את החיבור ונסו שוב"; renderBar(); }
}
window.addEventListener("beforeunload",e=>{ if(EDIT&&DIRTY){ e.preventDefault(); e.returnValue=""; } });
document.addEventListener("visibilitychange",async()=>{ if(!document.hidden&&USER&&!EDIT&&DUTY_API){ const r=REV; await loadBoard(); if(REV!==r&&!EDIT) render(); } });

async function start(){ await loadBoard(); if(canEdit()&&!dutiesOf(BOARD,USER.n).length) VIEW="all"; render(); }
(async function(){
  await loadAccess();
  const saved=LS("gordon_auth");
  if(saved&&!ACCESS[saved]) await waitUsers();
  if(saved&&ACCESS[saved]){ setUser(saved); start(); waitUsers().then(()=>{ if(USER_H&&!ACCESS[USER_H]){ setUser(null); showLogin("ההרשאה שלך הוסרה - פנו למנהל/ת"); } }); }
  else { $("main").innerHTML=""; showLogin(); }
})();
</script>
